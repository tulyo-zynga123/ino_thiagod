<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f4f6f8;
      color: #222;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    #novaTarefa {
      flex: 1;
      min-width: 0;
      padding: 10px;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
    }

    li {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    li span {
      flex: 1;
    }

    .feita {
      text-decoration: line-through;
      color: #777;
    }
  </style>
</head>
<body>
  <main>
    <h1>Minha lista de tarefas</h1>

    <div class="entrada">
      <input id="novaTarefa"
             type="text"
             placeholder="Digite uma tarefa">
      <button id="adicionar">Adicionar</button>
    </div>

   <ul id="lista"></ul>
  </main>

  <script>

    const tarefas = [];

    const campo = document.getElementById("novaTarefa");
    const botao = document.getElementById("adicionar");
    const lista = document.getElementById("lista");

    function desenhar() {
      lista.innerHTML = "";

      tarefas.forEach((tarefa, indice) => {
        const item = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = tarefa.feita;

        checkbox.addEventListener("change", () => {
          tarefas[indice].feita = checkbox.checked;
          desenhar();
        });

        const texto = document.createElement("span");
        texto.textContent = tarefa.texto;
        
        const anotacao = document.createElement("input");
        anotacao.type = "text";
        anotacao.placeholder = "Digite uma anotação";

        if (tarefa.feita) {
          texto.classList.add("feita");
        }

        const remover = document.createElement("button");
        remover.textContent = "Remover";

        remover.addEventListener("click", () => {
          tarefas.splice(indice, 1);
          desenhar();
        });

        item.append(checkbox, texto, remover);
        lista.appendChild(item);
      });
    }

    botao.addEventListener("click", () => {
      const texto = campo.value.trim();

      if (texto === "") {
        return;
      }

      tarefas.push({
        texto: texto,
        feita: false
      });

      campo.value = "";
    desenhar();
    });

    desenhar();
  </script>
</body>
</html>
